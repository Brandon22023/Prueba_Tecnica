services:
  mysql:
    image: mysql:9.7
    container_name: mysql_db
    restart: unless-stopped
    command: ["--default-time-zone=-06:00"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tecnica
      MYSQL_USER: usuario
      MYSQL_PASSWORD: tecnica123
    ports:
      - "3307:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/triggers.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: usuario
      DB_PASSWORD: tecnica123
      DB_NAME: tecnica
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - backend

networks:
  backend:
